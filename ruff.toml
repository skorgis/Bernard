target-version = "py312"
line-length = 80
# Third-party code copied as-is (former submodules); not ours to restyle.

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "D",   # pydocstyle
]
ignore = [
    "D203",  # 1 blank line required before class docstring
    "D212",  # Multi-line docstring summary should start at the second line
]

[lint.pydocstyle]
convention = "google"

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[lint.isort]
known-first-party = ["bmc_leds", "tirol_hackathon_bernard_gruppe", "detection_worker", "picture_pipeline"]

[lint.per-file-ignores]
"__init__.py" = ["D104"]
