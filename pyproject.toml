[project]
name = "tirol-hackathon-bernard-gruppe"
version = "0.1.0"
description = "This Project is a Project Starter for the hackathon bernard gruppe"
authors = [{name = "Christoph Meyer",email = "christoph.meyer@bernard-gruppe.com"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.1.0",
]

[project.scripts]
detection-worker = "detection_worker.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.12.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tirol_hackathon_bernard_gruppe", "src/detection_worker"]

[tool.pyright]
include = ["src", "tests", "main.py"]
typeCheckingMode = "standard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
