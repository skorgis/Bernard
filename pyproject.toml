[project]
name = "python-template"
version = "0.1.0"
description = ""
authors = [
    {name = "christoph meyer",email = "christoph.meyer@bernard-gruppe.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.12.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/python_template"]

[tool.pyright]
include = ["src", "tests", "main.py"]
typeCheckingMode = "standard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
